# nginx on machine B (TLS termination in front of the app on machine A)
#
# Example server block. Replace the placeholders:
#   your-domain.example.com  -> your public hostname (must match the cert SAN;
#                               LINE rejects hostname mismatches outright)
#   APP_HOST_IP              -> machine A's LAN address (LAN_IP in .env)
#
# Resulting webhook URL:  https://your-domain.example.com/line/webhook

server {
    listen 443 ssl;
    server_name your-domain.example.com;

    # Optional: LINE's endpoint requirements list HTTP/2 support. HTTP/1.1 does
    # work in practice, so this is not a blocker. If you want it, uncomment the
    # line matching your version (check with `nginx -v`):
    #   nginx >= 1.25.1 ->  http2 on;
    #   older nginx     ->  change the listen line to: listen 443 ssl http2;
    #http2 on;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/private.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ==========================================
    # LineLog webhook -> app on machine A
    # ==========================================
    location /line/ {
        # Machine A, where the FastAPI app runs. NOT localhost — nginx here is
        # containerised, so localhost would resolve to the nginx container
        # (and would return 502).
        #
        # NO trailing slash on proxy_pass. Without one nginx forwards the URI
        # unchanged (/line/webhook -> /line/webhook), which is what FastAPI's
        # APIRouter(prefix="/line") expects. Adding a slash would rewrite it to
        # /webhook and every request would 404.
        proxy_pass http://APP_HOST_IP:8000;
        proxy_http_version 1.1;

        # X-Line-Signature is an HMAC over the RAW request body. Nothing here
        # may alter those bytes — no sub_filter, no request gzip, no charset
        # rewriting — or every signature check fails with a 400.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The handler does a DB insert plus a LINE profile lookup before it
        # answers. Generous enough not to cut it off, short enough that a hung
        # upstream doesn't let deliveries pile up.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Webhook payloads are small; anything bigger is not from LINE.
        client_max_body_size 1m;
    }

    # The health endpoint reports DB and Ollama reachability — internal detail,
    # no reason to publish it. An exact-match location outranks the /line/
    # prefix above, so this wins for this one path.
    location = /line/healthz {
        return 404;
    }
}
